<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vaultsmith</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#eef2ff;background:#101322}body{max-width:760px;margin:0 auto;padding:clamp(24px,6vw,72px) 20px}h1{font-size:clamp(2rem,7vw,4rem);margin:0 0 8px;background:linear-gradient(100deg,#a78bfa,#38bdf8);color:transparent;background-clip:text}p{color:#aab3d0}label{display:block;margin:22px 0 8px;color:#c9d2f0;font-weight:600}select,input,textarea,button{box-sizing:border-box;width:100%;border:1px solid #303957;border-radius:12px;background:#171c31;color:#f8fafc;padding:13px;font:inherit}textarea{min-height:160px;resize:vertical}button{margin-top:22px;background:linear-gradient(100deg,#7c3aed,#0284c7);border:0;cursor:pointer;font-weight:700}button:hover{filter:brightness(1.15)}.output{position:relative;margin-top:28px}.copy{position:absolute;right:10px;top:10px;width:auto;margin:0;padding:8px 12px;background:#293252}.error{color:#fda4af;min-height:1.3em}
</style></head><body><h1>Vaultsmith</h1><p>Encrypt an Ansible variable without leaving your phone.</p><form id="form"><label for="vault">Vault</label><select id="vault" required>{% for vault in vaults %}<option value="{{vault}}">{{vault}}</option>{% endfor %}</select><label for="variable">Variable name</label><input id="variable" pattern="[A-Za-z][A-Za-z0-9_]*" placeholder="my_variable" required><label for="value">Value</label><textarea id="value" required></textarea><div class="error" id="error"></div><button>Encrypt string</button></form><section class="output"><button class="copy" id="copy" type="button">Copy</button><label for="result">Vaulted output</label><textarea id="result" readonly placeholder="Your encrypted value will appear here"></textarea></section><script>
const form=document.querySelector('#form'), result=document.querySelector('#result'), error=document.querySelector('#error');form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';const r=await fetch('/api/encrypt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({vault_id:vault.value,variable:variable.value,value:value.value})});const d=await r.json();if(!r.ok){error.textContent=d.error||'Encryption failed';return}result.value=d.result});document.querySelector('#copy').onclick=async()=>{await navigator.clipboard.writeText(result.value)};
</script></body></html>
